ements":["犯人はBかDのどちらかだ","AとBのうち、一人だけが嘘をついている","AとCのうち、一人だけが嘘をついている","犯人はAかCのどちらかだ"]},{"title":"金の糸巻き","story":"ルンペルシュティルツヒェンの金の糸巻きが隠された。","n":4,"answer":1,"statements":["犯人はAかBのどちらかだ","犯人はAかCのどちらかだ","BとCのうち、一人だけが嘘をついている","Bが犯人だ"]},{"title":"真夜中の招待状","story":"舞踏会の招待状が、深夜に一枚抜き取られていた。","n":4,"answer":3,"statements":["犯人はAかDのどちらかだ","Cは犯人ではない","AとDのうち、一人だけが嘘をついている","AもDも本当のことを言っている"]},{"title":"お城の秘密の扉","story":"王宮の秘密の扉を、誰かがこっそり開けていた。","n":4,"answer":0,"statements":["犯人はCかDのどちらかだ","CもDも本当のことを言っている","AとBのうち、一人だけが嘘をついている","Bは本当のことを言っている"]},{"title":"魔女の砂糖菓子","story":"魔女の砂糖菓子に、誰かが眠り薬を混ぜた。","n":4,"answer":3,"statements":["BもCも本当のことを言っている","犯人はBかDのどちらかだ","Dは嘘をついている","犯人はBかCのどちらかだ"]},{"title":"王妃の封蝋","story":"王妃の手紙の封蝋が、何者かに剥がされていた。","n":4,"answer":3,"statements":["CとDのうち、一人だけが嘘をついている","犯人はCかDのどちらかだ","Aは本当のことを言っている","CとDはどちらも無実だ"]},{"title":"毒林檎のすり替え","story":"毒林檎が、普通の林檎と入れ替えられていた。","n":5,"answer":3,"statements":["AもCも本当のことを言っている","犯人はA・C・Dの誰かだ","犯人はCかDのどちらかだ","Cは嘘をついている","B・C・Eは全員無実だ"]},{"title":"封じられた鏡","story":"真実を映す鏡に、誰かが封印を施した。","n":5,"answer":3,"statements":["AもEも本当のことを言っている","犯人はA・B・Dの誰かだ","犯人はB・C・Dの誰かだ","犯人はB・C・Eの誰かだ","Aは本当のことを言っている"]},{"title":"三つの糸車","story":"古いお城の三つの糸車のうち、一つだけが動かされていた。","n":5,"answer":2,"statements":["犯人はAかCのどちらかだ","犯人はA・C・Dの誰かだ","犯人はA・B・Dの誰かだ","AとEはどちらも無実だ","犯人はA・B・Cの誰かだ"]},{"title":"忘れられた舞踏会","story":"王妃が隠した舞踏会の招待状を、誰かが持ち出した。","n":5,"answer":2,"statements":["BもDも本当のことを言っている","BとCのうち、一人だけが嘘をついている","犯人はBかEのどちらかだ","AもDも本当のことを言っている","A・B・Dは全員無実だ"]},{"title":"禁じられた青い扉","story":"青ひげの城にある禁じられた扉が開かれていた。","n":5,"answer":1,"statements":["A・C・Eは全員無実だ","A・B・Dは全員無実だ","DとEはどちらも無実だ","BとEのうち、一人だけが嘘をついている","AもCも本当のことを言っている"]},{"title":"茨の呪文","story":"茨の城の眠りの呪文が、何者かに書き換えられた。","n":5,"answer":3,"statements":["犯人はA・D・Eの誰かだ","犯人はC・D・Eの誰かだ","犯人はDかEのどちらかだ","CもDも本当のことを言っている","A・B・Cは全員無実だ"]},{"title":"十二時の金の鍵","story":"十二時の鐘が鳴る直前、王宮の金の鍵が盗まれた。","n":5,"answer":2,"statements":["DとEはどちらも無実だ","A・B・Eは全員無実だ","犯人はA・B・Dの誰かだ","犯人はBかCのどちらかだ","A・B・Dは全員無実だ"]},{"title":"海底の歌声","story":"人魚姫の歌声を閉じ込めた貝殻がなくなった。","n":5,"answer":0,"statements":["A・B・Cは全員無実だ","CもEも本当のことを言っている","CもDも本当のことを言っている","Bは本当のことを言っている","B・C・Dは全員無実だ"]},{"title":"月光の毒菓子","story":"月光に照らされるお菓子の家で、砂糖菓子がすり替えられた。","n":5,"answer":0,"statements":["BとCのうち、一人だけが嘘をついている","Aは嘘をついている","C・D・Eは全員無実だ","犯人はAかCのどちらかだ","犯人はA・B・Dの誰かだ"]},{"title":"王妃の最後の手紙","story":"王妃が隠していた秘密の手紙を、誰かが持ち去った。","n":5,"answer":0,"statements":["A・B・Dは全員無実だ","犯人はA・C・Dの誰かだ","BとCはどちらも無実だ","CとEはどちらも無実だ","Aは嘘をついている"]}];
const COLORS=['❤️','🧡','💛','💚','🩵','💙','💜'];
const CHAPTERS=[{icon:'🎀',title:'第一の罠｜締め紐編',sub:'3人の証言から真実を探す',id:'ribbon'},{icon:'🪮',title:'第二の罠｜毒の櫛編',sub:'4人の証言が絡み合う',id:'comb'},{icon:'🍎',title:'第三の罠｜毒林檎編',sub:'5人の証言に潜む最後の罠',id:'apple'}];
let screen=document.getElementById('screen'),state={chapter:0,num:0,mode:'home',selected:-1,colors:[],result:null,done:0,correct:0,lock:false,records:[]},timer=null;
function shuffle(list){let a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function puzzle(){return BANK[state.chapter*10+state.num]}
function heartName(i){return state.colors[i]+'の小人'}
function mapSentence(text){return text.replace(/[A-E]/g,c=>state.colors[c.charCodeAt(0)-65])}
function clearTimer(){if(timer){clearInterval(timer);clearTimeout(timer);timer=null}}
function setHTML(html){screen.innerHTML=html}
function progress(){return `<div class="progress"><span>${state.num+1} / 10 問</span><span>正解 ${state.correct} 問</span></div><div class="dots">${Array.from({length:10},(_,i)=>`<span class="dot ${i<state.num?'done':''} ${i===state.num?'active':''}"></span>`).join('')}</div>`}
function topbar(){return `<div class="topline"><button class="back" id="back">← 章を選ぶ</button><span>${CHAPTERS[state.chapter].icon} ${CHAPTERS[state.chapter].title}</span></div>`}
function mirror(inner,cls=''){return `<div class="mirror-wrap ${cls==='mirror-glow'?'glow-stage':''}"><span class="mirror-top" aria-hidden="true">✦</span><div class="mirror ${cls}" id="mirror">${inner}</div><span class="mirror-bottom" aria-hidden="true">◆</span></div>`}
function home(){cancelResultSequence();clearTimer();state.mode='home';setHTML(`<div class="card"><p class="center label">王妃が仕掛けた三つの罠</p><p class="note center">誰かが嘘をついている――。<br>証言の矛盾を見抜いて、鏡に真実を映そう。</p><div class="stage-list">${CHAPTERS.map((c,i)=>`<button class="stage" data-stage="${i}"><span class="emoji">${c.icon}</span><span><strong>${c.title}</strong><small>${c.sub} · 10問</small></span><span class="arrow">❯</span></button>`).join('')}</div><div class="ornament"></div><p class="note">❤️ 🧡 💛 💚 🩵 💙 💜 の七人から、毎回数人が証言します。<br>犯人は一人だけ。<b>嘘をつくのは犯人だけ</b>です。</p><p class="note">※すべての章を自由に選べます。各章の10問に挑戦できます。</p></div>`);document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>startStage(+el.dataset.stage))}
function attachBack(){document.getElementById('back').onclick=home}
function startStage(idx){state.chapter=idx;state.num=0;state.correct=0;state.done=0;state.records=[];loadQuestion()}
function loadQuestion(){cancelResultSequence();clearTimer();state.mode='intro';state.lock=false;state.selected=-1;state.result=null;state.colors=state.records[state.num]?.colors||shuffle(COLORS).slice(0,puzzle().n);intro()}
function intro(){let p=puzzle();setHTML(`${topbar()}${progress()}<div class="card"><p class="label center">${CHAPTERS[state.chapter].title}</p><h2 class="story-title">${p.title}</h2>${mirror('<div id="typewriter" class="mirror-text cursor"></div>')}<p class="note center">鏡の中に、事件が浮かび上がる……</p><button class="button" id="advance" disabled>証言を聞く</button><button class="button secondary" id="skip" style="margin-top:9px">演出をスキップ</button></div>`);attachBack();let writer=document.getElementById('typewriter'),message=p.story+'\n\n犯人は誰？';let cursor=0;const finish=()=>{clearTimer();writer.textContent=message;writer.classList.remove('cursor');document.getElementById('advance').disabled=false;document.getElementById('skip').classList.add('hidden')};document.getElementById('skip').onclick=finish;document.getElementById('advance').onclick=testimony;timer=setInterval(()=>{cursor++;writer.textContent=message.slice(0,cursor);if(cursor>=message.length)finish()},65)}
function testimony(){clearTimer();state.mode='testimony';let p=puzzle();setHTML(`${topbar()}${progress()}<div class="card"><div class="label center">事件｜${p.title}</div><p class="question-caption">${p.story}<br><b>犯人だけが嘘をついています。</b></p>${p.statements.map((line,i)=>`<div class="speech"><div class="heart">${state.colors[i]}</div><div class="bubble"><span class="speaker">${heartName(i)}</span>「${mapSentence(line)}」</div></div>`).join('')}<div class="ornament"></div><div class="label center">あなたが選ぶ犯人は？</div><div class="choices" role="group" aria-label="犯人を選択">${state.colors.map((heart,i)=>`<button class="choice" aria-label="${heartName(i)}" data-choice="${i}">${heart}</button>`).join('')}</div><button class="button" id="judge" disabled>🪞 真実を映し出す</button></div>`);attachBack();document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{state.selected=+el.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===el));document.getElementById('judge').disabled=false});document.getElementById('judge').onclick=judge}
// Result effects are explicitly separated. No apple is rendered in the cracked phase.
let resultSequence=0;
function cancelResultSequence(){resultSequence++}
function crackArtwork(){
  // A dense, branching network drawn within the glass (not a rotating emoji overlay).
  const main=[
    'M50 0 L48 12 L59 25 L44 38 L52 51 L39 67 L47 81 L29 96 L37 113 L16 135',
    'M48 12 L34 21 L22 17 L9 30 L0 28','M59 25 L74 20 L87 30 L100 23',
    'M44 38 L29 42 L20 56 L6 62 L0 73','M52 51 L67 59 L76 55 L89 70 L100 66',
    'M39 67 L23 74 L15 70 L0 85','M47 81 L63 92 L73 89 L88 105 L100 101',
    'M29 96 L15 111 L0 108','M37 113 L55 123 L69 119 L82 135 L100 139',
    'M44 38 L45 26 L36 10 L38 0','M52 51 L59 39 L81 42 L100 35',
    'M47 81 L53 67 L69 64 L80 51 L100 50','M37 113 L29 126 L33 143 L24 160'
  ];
  const shard=['M48 12 L59 25 L44 38 L34 21 Z','M52 51 L67 59 L76 55 L59 39 Z','M39 67 L47 81 L29 96 L23 74 Z','M37 113 L55 123 L69 119 L47 81 Z','M59 25 L74 20 L87 30 L81 42 L59 39 Z','M23 74 L39 67 L29 42 L20 56 Z'];
  return `<svg class="crack-svg" viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true"><g>${shard.map(d=>`<path class="shard" d="${d}"/>`).join('')}</g><g>${main.map(d=>`<path class="dark-cut" d="${d}"/>`).join('')}</g><g>${main.map(d=>`<path class="white-edge" d="${d}"/>`).join('')}</g></svg>`;
}
function magicArtwork(){return `<div class="magic-flares" aria-hidden="true">${Array.from({length:5},()=>'<span class="magic-spark">✦</span>').join('')}</div>`}
function judge(){
  if(state.lock||state.selected<0)return;
  state.lock=true;state.mode='result';
  const p=puzzle();state.result=(state.selected===p.answer);
  state.records[state.num]={choice:state.selected,correct:state.result,colors:[...state.colors]};
  state.correct=state.records.filter(record=>record?.correct).length;
  state.done=state.records.filter(Boolean).length;
  runResultSequence();
}
function runResultSequence(){
  let seq=++resultSequence;
  if(state.result){showResultPhase('correct');setTimeout(()=>{if(seq===resultSequence&&state.mode==='result')showResultPhase('final')},1950);return}
  showResultPhase('poison');
  setTimeout(()=>{if(seq===resultSequence&&state.mode==='result')showResultPhase('cracked')},2600);
  setTimeout(()=>{if(seq===resultSequence&&state.mode==='result')showResultPhase('restore')},6500);
  setTimeout(()=>{if(seq===resultSequence&&state.mode==='result')showResultPhase('final')},9950);
}
function showResultPhase(phase){
  let p=puzzle(), right=state.result;
  let final=phase==='final',cls='',inner='',status='',progressLine='';
  if(phase==='poison'){
    cls='mirror-dim';inner='<span class="poison-scene" aria-label="毒林檎">🍎</span>';
    status='鏡に毒林檎が現れた……';progressLine='この後、鏡が砕けて、魔法で元に戻る。';
  }else if(phase==='cracked'){
    cls='shattered';inner=crackArtwork();
    status='バキバキッ！ 鏡の表面が砕けた！';progressLine='割れた鏡に、細かなひびが広がっていく……';
  }else if(phase==='restore'){
    cls='restoring';inner=crackArtwork()+magicArtwork();
    status='魔法の光が、鏡を修復していく……';progressLine='紫色の光がひびを包み、元の姿を取り戻す。';
  }else if(phase==='correct'){
    // The mirror illuminates with no heart; the answer appears exactly once in the final phase.
    cls='mirror-glow';inner='';
    status='鏡が光り、真実を呼び起こしている……';progressLine='光の向こうに答えが浮かび上がる……';
  }else{
    cls='crystal-fixed';
    inner=`<span class="result-symbol" aria-label="${heartName(p.answer)}">${state.colors[p.answer]}</span>`;
    status=right?'真実が、鏡に映し出された。':'鏡は元通りになり、真実が映し出された。';
    progressLine='鏡が答えを映しています……';
  }
  const explanation=right?'「あら、正解。なかなかやるじゃない？」':'「ふふっ……毒林檎を召し上がれ♡」';
  setHTML(`${topbar()}${progress()}<div class="card"><p class="label center">${right?'✧ TRUE ✧':'✦ FALSE ✦'}</p><h2 class="story-title">${p.title}</h2>${mirror(inner,cls)}<p class="center note phase-message" role="status">${status}</p>${final?`<div class="explain"><strong>${right?'正解！':'残念、不正解！'} 犯人は ${heartName(p.answer)}</strong><p>${explanation}</p><p>${heartName(p.answer)}の証言だけが嘘で、それ以外の${p.n-1}人は本当のことを言っています。各証言を犯人に当てはめると、矛盾なく成立するのはこの小人だけです。</p></div><div style="margin-top:15px"><button class="button secondary" id="replay" style="margin-bottom:10px">✦ 演出をもう一度見る</button><div class="result-navigation"><button class="button secondary" id="review-current">↶ この事件を見直す</button>${state.num>0?'<button class="button secondary" id="previous">← 前の事件へ戻る</button>':''}</div><button class="button" id="next" style="margin-top:10px">${state.num===9?'この章の結果を見る':'次の事件へ →'}</button></div>`:`<p class="center note">${progressLine}</p>`}</div>`);
  attachBack();
  if(final){document.getElementById('next').onclick=next;document.getElementById('replay').onclick=runResultSequence;document.getElementById('review-current').onclick=()=>reviewIncident(state.num);if(state.num>0)document.getElementById('previous').onclick=()=>reviewIncident(state.num-1)}
}
function reviewIncident(num){
  cancelResultSequence();clearTimer();state.num=num;state.lock=false;state.result=null;
  const record=state.records[num];state.selected=-1;
  state.colors=record?.colors||shuffle(COLORS).slice(0,puzzle().n);
  testimony();
  if(record){let hint=document.createElement('p');hint.className='note center';hint.textContent='前に見た証言です。もう一度推理して、回答を変更できます。';document.getElementById('judge').before(hint)}
}
function next(){cancelResultSequence();clearTimer();if(state.num===9){summary();return}state.num++;loadQuestion()}
function summary(){clearTimer();state.mode='summary';setHTML(`${topbar()}<div class="card center"><p class="label">章の終わり</p><h2>${CHAPTERS[state.chapter].icon} ${CHAPTERS[state.chapter].title}</h2>${mirror(`<div class="mirror-text"><div style="font-size:36px;color:#f5d5a8">${state.correct} / 10</div><div style="font-size:14px">問 正 解</div></div>`,'mirror-glow')}<p>「ふふっ、りんごちゃんの謎を、ここまで解けたのね。」</p><div class="actions"><button class="button secondary" id="again">もう一度</button><button class="button" id="end">章を選ぶ</button></div></div>`);attachBack();document.getElementById('again').onclick=()=>startStage(state.chapter);document.getElementById('end').onclick=home}
home();
</script></body></html>
